services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: messsaga-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_URL: ${AWS_URL}
      AWS_BUCKET: ${AWS_BUCKET}
    ports:
      - "${SERVER_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      queue:
        condition: service_started

  queue:
    image: messsaga-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_URL: ${AWS_URL}
      AWS_BUCKET: ${AWS_BUCKET}
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=1
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
      - ./config:/var/www/html/config
      - ./public/index.php:/var/www/html/public/index.php
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  scheduler:
    image: messsaga-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      AWS_ENDPOINT: ${AWS_ENDPOINT_FOR_DOCKER_COMPOSE:-http://minio:9000}
      AWS_URL: ${AWS_ENDPOINT_FOR_DOCKER_COMPOSE:-http://minio:9000}/${AWS_BUCKET:-messsaga-media}
    command: php artisan schedule:work
    volumes:
      - app_storage:/var/www/html/storage
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./app:/var/www/html/app
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  mysql:
    image: mysql:9.6
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${AWS_BUCKET:-messsaga-media}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    env_file:
      - .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}; do sleep 1; done;
      mc mb -p local/${AWS_BUCKET:-messsaga-media} || true;
      exit 0;
      "

volumes:
  mysql_data:
  app_storage:
  minio_data:
